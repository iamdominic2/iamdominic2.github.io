<p>On one hand it does help with the demands from the outside world, in
that doing is better than not doing.</p>
<p>However it may cause your days to be sadder. The problem lies in
unreasonable <a href="work-life_balance.html" class="wikilink"
title="work-life balance">work-life balance</a> demands or such, not in
self-discipline though.</p>
