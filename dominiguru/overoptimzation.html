<p>Perhaps it's <a href="productive_procrastination.html" class="wikilink"
title="productive procrastination">productive procrastination</a>. But
humans literally never want to minimize time spent, unless it's
undesirable. Perhaps optimization <em>itself</em> is desirable
<em>because</em> it satisfies the need for growth if they need to do
something similar next time.</p>
