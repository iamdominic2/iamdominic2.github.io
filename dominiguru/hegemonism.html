<h2 id="hegemonism">Hegemonism</h2>
<p>The aggressive policy or practice of a dominant state exercising
control, influence, or supremacy over other nations, often serving its
own national interests, like corruption sometimes at the cost of <a
href="freedom.html" class="wikilink" title="freedom">freedom</a>.</p>
