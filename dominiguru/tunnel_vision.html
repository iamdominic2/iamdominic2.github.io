<h2 id="tunnel_vision">Tunnel vision</h2>
<p>This is straight-up normal.<br />
It's linked to relevance and recency bias. One consequence is not being
able to see the future. But it is hard to see what currently can't be
seen.<br />
It's also called Present bias</p>
<p>You cannot see the future, and the past may not be relevant</p>
