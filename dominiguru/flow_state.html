<h2 id="flow_state">Flow state</h2>
<p>A rare state where you do something and cannot stop! I probably won't
apply it to <a href="social_media.html" class="wikilink"
title="social media">social media</a> though because it's usually
high-frequency topic switching and a bit passive. Schopenhauer thinks
this is really the time where the pain of life stops for a while -
though you cannot force it.</p>
