<p><a href="Manipulation.html" class="wikilink"
title="Manipulation">Manipulation</a>: strategy that gives illusion of
control while actually trapping them. E.g. "Do your homework or lose
your computer time!"<br />
It's a choice, but not really one, since one is so far better than the
other, yet tricks the person into thinking they had agency all
along.</p>
