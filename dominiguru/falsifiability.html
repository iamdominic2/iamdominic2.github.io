<h2 id="falsifiability">Falsifiability</h2>
<p>There is often a way to prove something wrong within the confines of
science. Falsifiability is thus how much or how easily something can be
<a href="logically.html" class="wikilink" title="logically">logically</a>
proven wrong in the first place by observation.</p>
