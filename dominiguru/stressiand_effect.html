<h2 id="stressiand_effect">Stressiand effect</h2>
<p>A reward deficit and the sense of mystery results in the "forbidden"
being more desired: 67, beer, children's candy, and one instance where a
catchy last name of a person at my school resulted in
<strong><em>more</em></strong> of his name being called. Sometimes,
restrictions can backfire a bit.</p>
