<h2 id="turing_completeness">Turing completeness</h2>
<p>System capable of simulating any Turing machine, meaning it can solve
any computational problem given enough time and memory. By the way, in
fact, even with simple basic commands, most <a href="programming.html"
class="wikilink" title="programming">programming</a> languages can do
almost anything.</p>
