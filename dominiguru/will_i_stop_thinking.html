<h2 id="will_i_stop_thinking">Will I stop thinking</h2>
<p>Technically not, I need to think to survive. <a href="Pragmatically.html"
class="wikilink" title="Pragmatically">Pragmatically</a>, also no; new
ones keep coming. Simply just human <a href="psychology.html"
class="wikilink" title="psychology">psychology</a>. Thus, I probably
will never be done with this until I somehow lose the ability to write
or access it (perhaps <a href="death.html" class="wikilink"
title="death">death</a>).</p>
