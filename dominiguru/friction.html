<p>Real life is full of it, yet people expect technology to lack it -
rather than that, it's yet another case of <a href="darwinism.html"
class="wikilink" title="darwinism">darwinism</a>: the frictionless apps
(from a business standpoint) beat the ones with friction (like <a
href="SuperMemo.html" class="wikilink" title="SuperMemo">SuperMemo</a>)
almost all the time.</p>
