<h2 id="nocebo_effect">Nocebo effect</h2>
<p>Nocebo effect as the mirror image of the <a href="placebo_effect.html"
class="wikilink" title="placebo effect">placebo effect</a>.</p>
<p>Nocebo effect: Eg., you get a pill that says headaches; a harmless
pill can actually exert a side effect of a headache.</p>
<p>Or you believe in myths that people told you, like Cold causes
Colds!</p>
