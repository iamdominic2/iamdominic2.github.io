<h2 id="defeatism">Defeatism</h2>
<p>Accepting defeat before trying - this one actually has consequences
due to the lack of <a href="action.html" class="wikilink"
title="action">action</a> (and the brain not trying to take risks).</p>
<h2 id="cycle">Cycle</h2>
<p>The reduced <a href="motivation.html" class="wikilink"
title="motivation">motivation</a> to try affirms itself - no outcomes no
motivation!</p>
