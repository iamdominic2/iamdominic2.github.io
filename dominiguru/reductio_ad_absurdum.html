<h2 id="reductio_ad_absurdum">Reductio ad absurdum</h2>
<p>Proof by contradiction. Following the <a href="logic.html"
class="wikilink" title="logic">logic</a> of a contrary proposition or
argument would lead to absurdity or contradiction. For instance: If
humans only value survival, they would intentionally get life
imprisonment, which ensures this with just enough food provided.</p>
