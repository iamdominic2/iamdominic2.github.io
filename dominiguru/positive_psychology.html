<p>Might work. However if it becomes <a href="coercion.html" class="wikilink"
title="coercion">coercion</a> it tries to dismiss the negative - and
most people wanting to know more about their psychology often wants
solutions to their problems anyways! So listen with non-judgement if
someone talks about negative psychological stuff.</p>
