<h2 id="esteem">Esteem</h2>
<p>How good a person feels about themselves.</p>
<p>It can be from external sources like praise, or internal sources like
contentment.</p>
<p>Low esteem can result in <a href="stress.html" class="wikilink"
title="stress">stress</a> level increases.</p>
<p>High esteem can paradoxically result in less <a href="motivation.html"
class="wikilink" title="motivation">motivation</a> to <a href="change.html"
class="wikilink" title="change">change</a>, or <a href="overconfidence.html"
class="wikilink" title="overconfidence">overconfidence</a>.</p>
