<h2 id="philosophy_and_math">Philosophy and math</h2>
<p>Both use <a href="logic.html" class="wikilink" title="logic">logic</a>:
the mechanism used to derive theorems from a set of starting
assumptions.<br />
Additionally, both fields begin with axioms, which are statements that
are accepted as true without proof.<br />
Also see: <a href="Mathematical_debates.html" class="wikilink"
title="Mathematical debates">Mathematical debates</a></p>
