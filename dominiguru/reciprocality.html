<h2 id="reciprocality">Reciprocality</h2>
<p>Being like the other person/suiting the other person; mutuality;
someone may sacrifice his/her true self.<br />
Often happens in social settings, e.g., friends or family… but then it’s
difficult to see whether the other person likes their own behaviors.</p>
